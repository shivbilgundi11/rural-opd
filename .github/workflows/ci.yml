name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Runs after build, on the artifacts a client would actually receive.
      # TA §7 — a failure here is a release blocker, not a warning.
      - name: Secret scan
        run: node scripts/scan-secrets.mjs --verbose

  # ---------------------------------------------------------------------------
  # Slots below are deliberately visible and disabled. Each names the module
  # that switches it on, so that module adds a line rather than a pipeline.
  # ---------------------------------------------------------------------------

  # Switched on by Module 2, not Module 3: the schema is the product's source of
  # truth from the moment it exists, and a regression in it is cheapest to catch
  # on the commit that caused it. Module 3 extended this job with the RLS
  # allow/deny matrix and the attack suite rather than creating it.
  #
  # TA §7 and PRD §8 both make RLS tests a release blocker, so this job must be a
  # **required status check** on the default branch — that part is a repository
  # setting, not a file, and docs/SECURITY-MODEL.md records it as such. Without
  # it the suite reports a failure that a merge can ignore, and the completeness
  # checks that are supposed to stop Module 8 adding an unprotected table stop
  # stopping anything.
  db-tests:
    name: Database (pgTAP + invariants + RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local stack
        run: supabase start

      # Applies every migration from zero and loads the seed — MODULE-PLAN §8's
      # first acceptance criterion, run on every commit rather than trusted.
      - name: Apply migrations from zero
        run: supabase db reset

      - name: Run pgTAP suite
        run: supabase test db

      # Every statement in this file must fail. One that succeeds is a business
      # rule that quietly stopped being enforced.
      - name: Prove the invariants
        run: node scripts/run-invariant-violations.mjs

      # Module 3. Every statement in the attack suite must be denied, and denied
      # in the coded way — a missing grant raising 42501 is a different control
      # from a policy quietly returning nothing, and swapping one for the other
      # is the regression this catches. TA §7 makes it a release blocker.
      - name: Prove the RLS policies deny what they should
        run: node scripts/run-rls-attacks.mjs

      # The proof pgTAP cannot give: two real connections contending for the
      # token counter.
      - name: Prove token numbering under concurrency
        run: node scripts/verify-token-concurrency.mjs

      # A migration that changes the schema without a regenerated db.types.ts is
      # a client that compiles against a database that no longer exists.
      - name: Generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code -- packages/shared/src/db.types.ts

  edge-tests:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    if: false # → enabled by Module 9 (payment order & checkout)
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
      - name: Run Deno tests
        run: deno test --allow-env --allow-net supabase/functions

  e2e:
    name: End-to-end (Maestro)
    runs-on: ubuntu-latest
    if: false # → enabled by Module 15 (hardening & release)
    steps:
      - uses: actions/checkout@v4
      - name: Run Maestro flows
        run: echo "Maestro flows land in Module 15"
